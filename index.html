<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(e => console.warn('SW register failed:', e));
  });
}
</script>

  <script>
    (function() {
      function _dismissLoader() {
        var el = document.getElementById('loading-screen');
        if (!el) return;
        var prog = document.getElementById('loading-progress');
        if (prog) prog.style.width = '100%';
        setTimeout(function() { el.classList.add('fade-out'); }, 200);
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 900);
      }
      // Dismiss when app is ready or after max 3.5s
      if (typeof PRO !== 'undefined' && PRO._onReady) {
        PRO._onReady(_dismissLoader);
      }
      window.addEventListener('load', function() {
        setTimeout(_dismissLoader, 1200);
      });
      setTimeout(_dismissLoader, 3500);
    })();
  </script>
